[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microscopy-image-analysis"
version = "0.1.0"
description = "Reproducible TIFF microscopy image inventory and baseline morphometry"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
  "tifffile>=2023.7",
  "imagecodecs>=2023.7",
]

[project.scripts]
microscopy-pipeline = "microscopy_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
